<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>if(new URLSearchParams(location.search).get('embedded')==='1'||new URLSearchParams(location.hash.slice(1)).get('embedded')==='1')document.documentElement.classList.add('workspace-embedded');</script>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || localStorage.getItem('theme') || 'dark';
                document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
            } catch(e) {}
        })();
    </script>
    <link rel="stylesheet" href="/static/css/tailwind-utilities.css?v=v0.0.1-alpha-2026">
    <script src="/static/vendor/js/lucide.js?v=v0.0.1-alpha-2026"></script>
    <script src="/static/js/theme.js?v=v0.0.1-alpha-2026"></script>
    <script src="/static/js/i18n.js?v=v0.0.1-alpha-2026"></script>
    <script src="/static/js/image-preview.js?v=v0.0.1-alpha-2026"></script>
    <script src="/static/js/workspace-common.js?v=v0.0.1-alpha-2026&m1=20260810e"></script>
    <script src="/static/js/generator-touchbar-context.js?v=v0.0.1-alpha-2026&m4=context-shell-20260831"></script>
    <script src="/static/js/floating-dismissal.js?v=v0.0.1-alpha-2026&m3=floating-dismissal"></script>
    <style>
        @import url('/static/vendor/css/fonts.css?v=v0.0.1-alpha-2026');
        :root { --accent:#111827; --bg:#f9fafb; --card:#fff; --easing:cubic-bezier(0.4,0,0.2,1); }
        body { background:var(--bg); font-family:"Source Han Sans CN",-apple-system,sans-serif; color:var(--accent); -webkit-font-smoothing:antialiased; }
        .container-box { max-width:1280px; margin:0 auto; padding:0 40px; margin-top:50px; }
        .nano-input { background:var(--card); border:1px solid #eef0f2; transition:all .3s var(--easing); }
        .nano-input:focus { border-color:#000; box-shadow:0 0 0 1px #000; }
        .upload-item { background:var(--card); border:1px dashed #e2e8f0; transition:all .4s var(--easing); position:relative; overflow:hidden; }
        .upload-item:hover,.upload-item.drag-over { border-color:#000; transform:translateY(-2px); }
        .preview-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; animation:fadeIn .5s var(--easing); }
        .glass-btn { background:#111827; transition:all .3s var(--easing); }
        .glass-btn:hover { background:#000; transform:translateY(-1px); box-shadow:0 12px 24px rgba(0,0,0,.1); }
        .result-frame { background:#fff; border-radius:32px; border:1px solid #f1f5f9; box-shadow:0 2px 15px rgba(0,0,0,.02); }
        .tool-panel { background:#fff; border:1px solid #edf0f3; border-radius:24px; padding:12px; display:flex; flex-direction:column; gap:10px; }
        .model-pill { background:#f8fafc; border:1px solid #edf2f7; border-radius:999px; padding:3px; display:grid; grid-template-columns:1fr 1fr; gap:2px; }
        .model-option { border-radius:999px; height:34px; display:flex; align-items:center; justify-content:center; gap:6px; color:#64748b; font-size:10px; font-weight:600; letter-spacing:.02em; transition:all .25s var(--easing); }
        .model-option.active { background:#fff; color:#111827; box-shadow:0 1px 3px rgba(15,23,42,.08); }
        .control-panel { background:#fff; border:1px solid #edf0f3; border-radius:24px; padding:12px; display:flex; flex-direction:column; gap:10px; }
        .control-label { display:flex; align-items:center; gap:6px; color:#94a3b8; font-size:10px; font-weight:600; letter-spacing:.04em; }
        .size-row { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; align-items:start; }
        .size-field { min-width:0; display:flex; flex-direction:column; gap:6px; }
        .size-select,.size-custom { width:100%; min-width:0; max-width:100%; height:34px; border:1px solid #edf2f7; border-radius:14px; background:#f8fafc; color:#111827; outline:none; padding:0 10px; font-size:11px; font-weight:700; }
        .size-select { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .size-select:disabled { opacity:.55; cursor:not-allowed; }
        .size-custom { display:none; background:#fff; }
        .size-field.custom .size-custom { display:block; }
        .size-pair { display:none; grid-template-columns:1fr 1fr; gap:6px; }
        .size-field.custom .size-pair { display:grid; }
        .size-pair .size-custom { display:block; }
        .size-pair.with-fit { grid-template-columns:1fr 1fr auto; align-items:center; }
        .size-fit-btn { height:34px; border:1px solid #edf2f7; border-radius:14px; background:#fff; color:#111827; padding:0 10px; font-size:10px; font-weight:800; white-space:nowrap; }
        .size-fit-btn:disabled { opacity:.45; cursor:not-allowed; }
        .mode-badge { font-size:9px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:#0f172a; background:#eef2ff; border:1px solid #e0e7ff; padding:2px 8px; border-radius:999px; }
        .masonry-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; }
        @media (min-width:768px){ .masonry-grid{ grid-template-columns:repeat(4,1fr); } }
        @media (max-width:640px){ .size-row{ grid-template-columns:1fr; } }
        .masonry-item { aspect-ratio:1/1; border-radius:24px; overflow:hidden; background:#fff; border:1px solid #f1f5f9; transition:all .5s var(--easing); }
        .masonry-item:hover { transform:translateY(-6px); box-shadow:0 20px 40px rgba(0,0,0,.08); }
        .gallery-lightbox { background:rgba(255,255,255,.99); backdrop-filter:blur(22px) saturate(1.05); }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    </style>
    <link rel="stylesheet" href="/static/css/theme.css?v=v0.0.1-alpha-2026">
    <style>
        html:not(.studio-theme-dark) body:not(.studio-theme-dark) #lightbox.gallery-lightbox {
            background: rgba(255,255,255,.99) !important;
            backdrop-filter: blur(22px) saturate(1.05) !important;

    <style data-signal-flow-page="online">
        body.gw-page--online { min-height: 100%; overflow-x: hidden; }
        body.gw-page--online .container-box { width: 100%; max-width: none; margin: 0; padding: 16px 24px 36px !important; box-sizing: border-box; }
        body.gw-page--online .container-box > header { min-height: 64px; margin: 0 0 18px !important; padding: 0 0 12px !important; border-bottom: 1px solid var(--sf-line); align-items: flex-end; }
        body.gw-page--online .container-box > header h1 { color: var(--sf-text) !important; font-size: var(--sf-fs-display) !important; font-style: normal !important; letter-spacing: 0 !important; }
        body.gw-page--online .container-box > header nav { display: none; }
        body.gw-page--online main { gap: 16px !important; }
        body.gw-page--online :is(.tool-panel, .control-panel, .result-frame, .upload-item, .masonry-item) { border-radius: var(--sf-radius-control) !important; box-shadow: none !important; }
        body.gw-page--online :is(.tool-panel, .control-panel, #resultBox) { border-color: var(--sf-line) !important; background: var(--sf-content) !important; }
        body.gw-page--online #resultBox { min-height: 440px !important; }
        body.gw-page--online :is(#placeholder, #loader) { opacity: 1 !important; color: var(--sf-muted) !important; }
        body.gw-page--online #genBtn { min-height: 40px !important; border-radius: var(--sf-radius-control) !important; }
        body.gw-page--online .container-box > section { margin-top: 32px !important; }

        @media (max-width: 620px) {
            body.gw-page--online .container-box { padding-inline: 12px !important; }

            body.gw-page--online #resultBox { min-height: 280px !important; }

</head>
<body class="gw-signal gw-page--online">
    <div class="container-box min-h-screen flex flex-col">
        <header class="flex justify-between items-end mb-16">
            <div class="space-y-1">
                <h1 class="text-4xl font-extrabold tracking-tighter italic" data-i18n="online.title">在线生图</h1>
                <p class="text-[10px] font-bold uppercase tracking-[0.4em] text-gray-400">GPT / NANO BANANA IMAGE STUDIO</p>
            </div>
            <nav class="hidden md:flex gap-8 text-[11px] font-bold uppercase tracking-widest text-gray-400">
                <span class="text-black border-b-2 border-black pb-1" data-i18n="online.create">Create</span>
            </nav>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-12 gap-12">
            <div class="lg:col-span-5 space-y-8">
                <section class="space-y-4">
                    <div class="flex items-center gap-2 text-gray-400">
                        <i data-lucide="terminal" class="w-3.5 h-3.5"></i>
                        <span class="text-[10px] font-black uppercase tracking-widest">Prompt</span>
                    </div>
                    <textarea id="promptInput" rows="5" aria-label="提示词" class="nano-input w-full p-6 rounded-3xl text-sm outline-none resize-none placeholder-gray-300" placeholder="输入想生成或编辑的画面..." data-i18n-placeholder="online.promptPlaceholder"></textarea>
                </section>

                <section class="space-y-4">
                    <div class="flex items-center gap-2 text-gray-400">
                        <i data-lucide="images" class="w-3.5 h-3.5"></i>
                        <span class="text-[10px] font-black uppercase tracking-widest" data-i18n="online.referenceImages">Reference Images</span>
                    </div>
                    <div class="grid grid-cols-3 gap-4">
                        <div id="drop-zone-1" onclick="document.getElementById('file1').click()" class="upload-item group aspect-square rounded-2xl flex flex-col items-center justify-center cursor-pointer">
                            <input type="file" id="file1" accept="image/*" class="hidden" onchange="handleFile(this.files[0],1)">
                            <i data-lucide="plus" class="w-5 h-5 text-gray-300 group-hover:text-black"></i><span class="text-[9px] mt-2 font-bold text-gray-400 uppercase">Main</span>
                            <img id="prev1" class="preview-img hidden"><button id="del1" onclick="clearSlot(1,event)" class="hidden absolute top-2 right-2 w-6 h-6 bg-white/90 rounded-full shadow-sm z-10">×</button>
                        </div>
                        <div id="drop-zone-2" onclick="document.getElementById('file2').click()" class="upload-item group aspect-square rounded-2xl flex flex-col items-center justify-center cursor-pointer">
                            <input type="file" id="file2" accept="image/*" class="hidden" onchange="handleFile(this.files[0],2)">
                            <i data-lucide="plus" class="w-5 h-5 text-gray-300 group-hover:text-black"></i><span class="text-[9px] mt-2 font-bold text-gray-400 uppercase">Aux A</span>
                            <img id="prev2" class="preview-img hidden"><button id="del2" onclick="clearSlot(2,event)" class="hidden absolute top-2 right-2 w-6 h-6 bg-white/90 rounded-full shadow-sm z-10">×</button>
                        </div>
                        <div id="drop-zone-3" onclick="document.getElementById('file3').click()" class="upload-item group aspect-square rounded-2xl flex flex-col items-center justify-center cursor-pointer">
                            <input type="file" id="file3" accept="image/*" class="hidden" onchange="handleFile(this.files[0],3)">
                            <i data-lucide="plus" class="w-5 h-5 text-gray-300 group-hover:text-black"></i><span class="text-[9px] mt-2 font-bold text-gray-400 uppercase">Aux B</span>
                            <img id="prev3" class="preview-img hidden"><button id="del3" onclick="clearSlot(3,event)" class="hidden absolute top-2 right-2 w-6 h-6 bg-white/90 rounded-full shadow-sm z-10">×</button>
                        </div>
                    </div>
                </section>

                <div class="tool-panel">
                    <div class="control-label">
                        <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>
                        <span data-i18n="online.model">Model</span>
                        <span id="providerModeBadge" class="mode-badge" style="margin-left:auto;display:none;"></span>
                    </div>
                    <div class="size-row">
                        <label class="size-field">
                            <select id="providerSelect" aria-label="图像服务商" class="size-select" onchange="setProvider(this.value)"></select>
                        </label>
                        <label class="size-field">
                            <select id="modelSelect" aria-label="图像模型" class="size-select" onchange="setModel(this.value)"></select>
                        </label>
                    </div>
                    <div id="adaptiveExtras" class="size-row" style="margin-top:2px;">
                        <label id="qualityField" class="size-field">
                            <select id="qualitySelect" class="size-select" onchange="setQuality(this.value)" title="Quality">
                                <option value="auto" data-i18n="online.qualityAuto">自动</option>
                                <option value="low" data-i18n="online.qualityLow">低</option>
                                <option value="medium" data-i18n="online.qualityMedium">中</option>
                                <option value="high" data-i18n="online.qualityHigh">高</option>
                            </select>
                        </label>
                        <label id="countField" class="size-field">
                            <select id="countSelect" class="size-select" onchange="setCount(this.value)" title="Count">
                                <option value="1" selected>×1</option>
                                <option value="2">×2</option>
                                <option value="3">×3</option>
                                <option value="4">×4</option>
                            </select>
                        </label>
                    </div>
                    <div class="control-label mt-1">
                        <i data-lucide="ruler" class="w-3.5 h-3.5"></i>
                        <span data-i18n="online.size">Size</span>
                    </div>
                    <div class="size-row">
                        <label id="resolutionField" class="size-field">
                            <select id="resolutionSelect" class="size-select" onchange="setResolution(this.value)">
                                <option value="1k" selected>1K</option>
                                <option value="2k">2K</option>
                                <option value="4k">4K</option>
                                <option value="custom" data-i18n="online.customSize">自定义尺寸</option>
                            </select>
                            <span class="size-pair with-fit">
                                <input id="sizeCustomWidth" class="size-custom" type="number" min="64" step="64" placeholder="宽度" data-i18n-placeholder="online.width" oninput="setCustomSize()">
                                <input id="sizeCustomHeight" class="size-custom" type="number" min="64" step="64" placeholder="高度" data-i18n-placeholder="online.height" oninput="setCustomSize()">
                                <button id="fitImageSizeBtn" class="size-fit-btn" type="button" onclick="fitCustomSizeToImage(event)">适配图片</button>
                            </span>
                        </label>
                        <label id="ratioField" class="size-field">
                            <select id="ratioSelect" class="size-select" onchange="setRatio(this.value)">
                                <option value="" data-i18n="online.emptyRatio">比例为空</option>
                                <option value="square" selected data-i18n="online.square">1:1 方图</option>
                                <option value="portrait" data-i18n="online.portrait">2:3 竖图</option>
                                <option value="landscape" data-i18n="online.landscape">3:2 横图</option>
                                <option value="portrait43">3:4 竖图</option>
                                <option value="landscape43">4:3 横图</option>
                                <option value="story" data-i18n="online.story">9:16 竖屏</option>
                                <option value="wide" data-i18n="online.wide">16:9 宽屏</option>
                                <option value="custom" data-i18n="online.customRatio">自定义比例</option>
                            </select>
                            <span class="size-pair">
                                <input id="ratioCustomWidth" class="size-custom" type="number" min="1" step="1" placeholder="宽" data-i18n-placeholder="online.ratioWidth" oninput="setCustomRatio()">
                                <input id="ratioCustomHeight" class="size-custom" type="number" min="1" step="1" placeholder="高" data-i18n-placeholder="online.ratioHeight" oninput="setCustomRatio()">
                            </span>
                        </label>
                    </div>
                </div>

                <button id="genBtn" onclick="submitImage()" class="glass-btn w-full py-5 text-white rounded-3xl font-bold flex items-center justify-center gap-3 shadow-lg">
                    <i data-lucide="zap" class="w-4 h-4 text-yellow-400"></i>
                    <span class="tracking-[0.3em] text-[11px] uppercase" data-i18n="online.generate">Generate</span>
                </button>
            </div>

            <div class="lg:col-span-7">
                <div id="resultBox" class="result-frame min-h-[500px] lg:h-full flex items-center justify-center relative overflow-hidden">
                    <div id="placeholder" class="text-center space-y-4 opacity-20"><i data-lucide="layout" class="w-12 h-12 mx-auto stroke-[1px]"></i><p class="text-[10px] font-black tracking-[0.5em] uppercase" data-i18n="online.canvasReady">Canvas Ready</p></div>
                    <div id="loader" class="hidden text-center space-y-3 px-8" role="status" aria-live="polite" aria-atomic="true">
                        <div class="w-8 h-8 border-2 border-black border-t-transparent rounded-full animate-spin mx-auto"></div>
                        <p id="taskStateLabel" class="text-[10px] font-black tracking-[0.35em] uppercase" data-i18n="online.generating">Generating</p>
                        <p id="taskStateDetail" class="max-w-sm text-xs leading-5 text-gray-400"></p>
                        <button id="taskCenterLink" type="button" onclick="openCurrentTask()" class="hidden mx-auto text-[10px] font-black tracking-widest text-gray-500 underline decoration-gray-300 underline-offset-4 hover:text-black">查看任务</button>
                    </div>
                    <div id="resultError" class="hidden max-w-md px-8 text-center" role="alert"><i data-lucide="circle-alert" class="mx-auto mb-3 h-7 w-7 text-red-500"></i><p id="resultErrorText" class="text-sm font-semibold leading-6 text-red-700"></p><button id="errorTaskCenterLink" type="button" onclick="openCurrentTask()" class="hidden mt-4 text-[10px] font-black tracking-widest text-gray-500 underline decoration-gray-300 underline-offset-4 hover:text-black">查看任务</button></div>
                    <img id="outputImg" class="hidden w-full h-full object-contain p-8 cursor-zoom-in" onclick="zoomImage()">
                    <a id="downloadBtn" href="#" download class="hidden absolute top-8 right-8 w-12 h-12 bg-white/90 shadow-2xl rounded-2xl flex items-center justify-center hover:bg-black hover:text-white"><i data-lucide="download" class="w-4 h-4"></i></a>
                </div>
            </div>
        </main>

        <section class="mt-32">
            <div class="flex items-center gap-6 mb-12"><h2 class="text-[11px] font-black uppercase tracking-[0.5em]" data-i18n="online.archives">Archives</h2><div class="h-px flex-1 bg-gray-100"></div></div>
            <div id="historyState" class="hidden py-12 text-center text-xs font-semibold text-gray-400" role="status" aria-live="polite"></div>
            <div id="masonry" class="masonry-grid"></div>
            <div id="loadMoreTrigger" class="py-20 text-center text-gray-300 text-[10px] font-bold uppercase tracking-widest cursor-pointer hover:text-black">Load More Archive</div>
        </section>
    </div>

    <div id="lightbox" onclick="handleOutsideClick(event)" data-floating-surface="online-lightbox" data-floating-kind="modal" data-floating-content="#lightboxFrame, #lightboxCard" data-floating-dismiss="outside" data-floating-escape="close-only" data-floating-close="closeLightbox" class="hidden fixed inset-0 z-50 gallery-lightbox flex flex-col items-center justify-center p-8">
        <button onclick="closeLightbox()" class="absolute top-10 right-10 text-gray-400 hover:text-black"><i data-lucide="x" class="w-8 h-8"></i></button>
        <div class="w-full flex flex-col items-center pointer-events-none" style="max-width:min(1280px, 92vw)">
            <div id="lightboxFrame" class="studio-preview-frame pointer-events-auto">
                <img id="lightboxImg" class="studio-preview-img" alt="preview">
                <div data-no-pan class="absolute top-6 left-6 bg-black/50 backdrop-blur-md text-white px-3 py-1.5 rounded-xl text-[10px] font-black tracking-widest shadow-2xl pointer-events-auto z-10">
                    <span id="lightboxRes">0x0</span>
                </div>
                <button id="lightboxDownload" onclick="downloadLightboxImage(event)" data-no-pan class="absolute top-6 right-6 bg-black text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-2xl hover:scale-105 transition-transform pointer-events-auto z-10">
                    <i data-lucide="download" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="lightboxCard" class="w-full mt-16 pointer-events-auto bg-white border border-gray-100 rounded-[2rem] p-8 shadow-sm flex justify-between items-center gap-8">
                <div class="flex-1">
                    <span class="text-[9px] font-black text-gray-300 uppercase tracking-widest block mb-2">Prompt</span>
                    <p id="lightboxPrompt" class="text-gray-700 text-sm leading-relaxed max-h-32 overflow-y-auto pr-2"></p>
                </div>
                <button id="sameStyleBtn" onclick="applySameStyle()" class="bg-black text-white px-8 py-3.5 rounded-2xl text-[10px] font-black uppercase tracking-widest flex items-center gap-2"><i data-lucide="copy" class="w-4 h-4"></i><span data-i18n="online.reuse">Reuse</span></button>
                <button id="useAsReferenceBtn" type="button" onclick="useLightboxAssetAsReference()" class="hidden bg-white text-black border border-gray-200 px-4 py-3.5 rounded-2xl text-[10px] font-black uppercase tracking-widest" title="设为参考素材" aria-label="设为参考素材"><i data-lucide="paperclip" class="w-4 h-4"></i></button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        function tr(key){ return window.StudioI18n ? StudioI18n.t(key) : key; }
        function applyLanguage(lang){
            if(lang && window.StudioI18n) StudioI18n.set(lang);
            document.title = tr('online.title');
            const loader = document.getElementById('loadMoreTrigger');
            if(loader && !isLoading) loader.innerText = tr('online.loadMore');
        }
        window.addEventListener('message', event => {
            if(event.data?.type === 'studio-lang') applyLanguage(event.data.lang);
            // API 设置页通过 postMessage 通知平台/模型变更（iframe 内嵌场景）
            if(event.data?.type === 'providers-changed' || event.data?.type === 'workflows-changed') scheduleProviderRefresh();
        });
        window.addEventListener('studio-lang-change', () => {
            document.title = tr('online.title');
            updateAdaptivePanel();
        });
        let refs = {1:null,2:null,3:null};
        let refDims = {1:null,2:null,3:null};
        let provider = 'comfly';
        let selectedModel = 'gpt-image-2';
        let apiProviders = [];
        let ratio = 'square';
        let resolution = '1k';
        let customRatioWidth = '';
        let customRatioHeight = '';
        let customWidth = '';
        let customHeight = '';
        let quality = 'auto';
        let outputCount = 1;
        let models = {gpt:'gpt-image-2', nano:'nano-banana-pro'};
        let allHistory = [], currentIndex = 0, currentResult = null, currentLightboxData = null, isLoading = false;
        let activeOnlineTask = onlineTaskState();
        const PAGE_SIZE = 24;
        const ONLINE_HISTORY_LIMIT = 120;
        const ONLINE_TASK_POLL_MS = 3500;

        function selectedInputAssetIds(){
            const seen = new Set();

                const assetId = typeof reference?.asset_id === 'string' ? reference.asset_id.trim() : '';

        function rememberOnlineTask(jobId){
            const cleanJobId = String(jobId || '').trim();

            try { sessionStorage.setItem(onlineTaskStorageKey(), cleanJobId); } catch(_) {}
        }

        function storedOnlineTaskId(){
            try {
                const jobId = String(sessionStorage.getItem(onlineTaskStorageKey()) || '').trim();
                return STABLE_WORKSPACE_JOB_ID_PATTERN.test(jobId) ? jobId : '';

        function restorePersistentOnlineTask(jobs){
            if(activeJobId() || !Array.isArray(jobs)) return;
            const storedJobId = storedOnlineTaskId();
            if(!storedJobId) return;
            const candidate = jobs.find(job => String(job?.id || '').trim() === storedJobId);
            if(!candidate) return;
            const status = String(candidate.status || '').trim().toLowerCase();
            if(['succeeded', 'failed', 'canceled', 'interrupted'].includes(status)){
                forgetOnlineTask();
                return;
            }
            if(!ONLINE_ACTIVE_STATUSES.has(status)) return;
            activeOnlineTask = onlineTaskState(candidate.id, candidate.status);
            document.getElementById('genBtn').disabled = true;
            setGenerationState(
                activeOnlineTask.lastStatus === 'queued' ? 'queued' : 'running',
                '已从持久任务恢复，正在续查远端结果。'

                throw error;
            }
            return {body, status:response.status};

        function uniqueModels(list){

        function imageProviders(){

            ));

        /* ---- RunningHub：同一平台下同步模型 API / 工作流 / AI 应用。
         * 模型 API 直接提交原始模型名；value=app:ID / workflow:ID 走 RH 应用/工作流路径。 */
        function runningHubEntryId(entry, kind){
            if(!entry || typeof entry !== 'object') return '';
            const raw = kind === 'model' ? (entry.model || entry.id || entry.name)
                : kind === 'workflow' ? (entry.workflowId || entry.id)
                : (entry.appId || entry.webappId || entry.id);
            return String(raw || '').trim();
        }
        function runningHubEntries(id){
            const p = providerById(id) || {};
            const collect = (list, kind) => (list || [])
                .filter(e => e && e.enabled !== false && e.hidden !== true)
                .map(e => ({ kind, id: runningHubEntryId(e, kind), title: String(e.title || e.note || '').trim() }))
                .filter(e => e.id);
            const models = uniqueModels(p.image_models || []).map(model => ({kind:'model', id:model, title:model}));
            return [...models, ...collect(p.rh_workflows, 'workflow'), ...collect(p.rh_apps, 'app')];
        }
        function isRunningHubProvider(id){ return providerProtocol(id) === 'runninghub'; }
        function renderProviderControls(){
            const providerSelect = document.getElementById('providerSelect');
            const modelSelect = document.getElementById('modelSelect');
            const providers = imageProviders();
            if(!providers.some(p => p.id === provider)) provider = providers[0]?.id || 'comfly';
            providerSelect.innerHTML = providers.map(p => `<option value="${escapeHtml(p.id)}" ${p.id === provider ? 'selected' : ''}>${escapeHtml(p.name || p.id)}</option>`).join('');
            if(isRunningHubProvider(provider)){
                const entries = runningHubEntries(provider);
                const keys = entries.map(e => e.kind === 'model' ? e.id : `${e.kind}:${e.id}`);
                if(!keys.includes(selectedModel)) selectedModel = keys[0] || '';
                modelSelect.innerHTML = entries.length
                    ? entries.map(e => {
                        const key = e.kind === 'model' ? e.id : `${e.kind}:${e.id}`;
                        const tag = e.kind === 'model' ? '模型 API' : e.kind === 'workflow' ? tr('online.rhWorkflow') : tr('online.rhApp');
                        const label = e.title || e.id;
                        return `<option value="${escapeHtml(key)}" ${key === selectedModel ? 'selected' : ''}>${escapeHtml(`[${tag}] ${label}`)}</option>`;
                    }).join('')
                    : `<option value="">${escapeHtml(tr('online.rhNoEntries'))}</option>`;
            } else {
                const modelsForProvider = providerModels(provider);
                if(!modelsForProvider.includes(selectedModel)) selectedModel = modelsForProvider[0] || models.gpt;
                modelSelect.innerHTML = modelsForProvider.map(m => `<option value="${escapeHtml(m)}" ${m === selectedModel ? 'selected' : ''}>${escapeHtml(m)}</option>`).join('');

        /* ---- 协议自适应：根据所选 provider 的 protocol 调整参数栏 ----
         * 后端 /api/online-image → generate_ai_image 已按协议分发，前端只需让
         * 与协议无关的控件随之显隐：质量仅 OpenAI 系（gpt-image）生效，其余协议忽略。 */
        function providerProtocol(id){
            const p = providerById(id) || {};
            const proto = String(p.protocol || '').toLowerCase();
            const pid = String(p.id || '').toLowerCase();
            const base = String(p.base_url || '').toLowerCase();
            if(proto === 'modelscope' || pid === 'modelscope') return 'modelscope';
            if(proto === 'runninghub' || pid === 'runninghub') return 'runninghub';
            if(proto === 'jimeng' || pid === 'jimeng') return 'jimeng';
            if(proto === 'volcengine' || pid === 'volcengine') return 'volcengine';
            if(proto === 'gemini') return 'gemini';
            if(proto === 'apimart' || base.includes('apimart.ai')) return 'apimart';
            return 'api';
        }
        const PROTOCOL_BADGE = {
            api:'online.modeApi', apimart:'online.modeApi', modelscope:'online.modeModelscope',
            runninghub:'online.modeRunningHub', jimeng:'online.modeJimeng',
            volcengine:'online.modeVolcengine', gemini:'online.modeGemini'
        };
        // 仅 OpenAI / APIMart（gpt-image 系）后端会消费 quality；其它协议忽略，隐藏以免误导。
        const QUALITY_PROTOCOLS = new Set(['api','apimart']);
        function updateAdaptivePanel(){
            const proto = providerProtocol(provider);
            const badge = document.getElementById('providerModeBadge');
            if(badge){
                badge.textContent = tr(PROTOCOL_BADGE[proto] || 'online.modeApi');
                badge.style.display = '';
            }
            const qf = document.getElementById('qualityField');
            if(qf) qf.style.display = QUALITY_PROTOCOLS.has(proto) ? '' : 'none';
            const qs = document.getElementById('qualitySelect');
            if(qs) qs.value = quality;
            // RunningHub 每次出图都是一次完整工作流运行，隐藏数量并固定为 1，避免误触发多次昂贵任务。
            if(proto === 'runninghub') outputCount = 1;
            const cf = document.getElementById('countField');
            if(cf) cf.style.display = (proto === 'runninghub') ? 'none' : '';
            const cs = document.getElementById('countSelect');
            if(cs) cs.value = String(outputCount);
        }
        function setQuality(next){ quality = next || 'auto'; }
        function setCount(next){ outputCount = Math.max(1, Math.min(4, parseInt(next, 10) || 1)); }

        async function initModels(){
            try {
                const cfg = await fetch('/api/config').then(r=>r.json());
                const imageModels = cfg.image_models || [];
                models.nano = imageModels.find(m => m.toLowerCase().includes('nano')) || 'nano-banana-pro';
                models.gpt = imageModels.find(m => !m.toLowerCase().includes('nano')) || cfg.image_model || 'gpt-image-2';
                apiProviders = Array.isArray(cfg.api_providers) ? cfg.api_providers : [];
                selectedModel = providerModels(provider)[0] || models.gpt;
            } catch(e) {}
            renderProviderControls();
        }
        // API 设置页保存后会广播 studio-api 事件；这里重新拉取 /api/config，
        // 尽量保留当前已选的平台/模型，renderProviderControls 会在其不存在时自动回退。
        async function refreshProvidersFromApiSettings(){
            try {
                const cfg = await fetch('/api/config').then(r=>r.json());
                const imageModels = cfg.image_models || [];
                models.nano = imageModels.find(m => m.toLowerCase().includes('nano')) || 'nano-banana-pro';
                models.gpt = imageModels.find(m => !m.toLowerCase().includes('nano')) || cfg.image_model || 'gpt-image-2';
                apiProviders = Array.isArray(cfg.api_providers) ? cfg.api_providers : [];
            } catch(e) { return; }
            renderProviderControls();

        let apiSyncTimer = null;
        function scheduleProviderRefresh(){
            clearTimeout(apiSyncTimer);
            apiSyncTimer = setTimeout(refreshProvidersFromApiSettings, 150);
        }
        try {
            const studioApiChannel = new BroadcastChannel('studio-api');
            studioApiChannel.addEventListener('message', () => scheduleProviderRefresh());
        } catch(e) {}
        // 页面重新可见时也兜底刷新一次（切回标签页 / iframe 重新展示）
        document.addEventListener('visibilitychange', () => { if(!document.hidden) scheduleProviderRefresh(); });

        function setProvider(next){
            provider = next;
            selectedModel = providerModels(provider)[0] || selectedModel;
            renderProviderControls();
        }
        function setModel(next){
            selectedModel = next;
        }
        function escapeHtml(str){ return String(str || '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }

        function parseSizeValue(value){
            const match = String(value || '').trim().match(/^(\d+)\s*[xX*]\s*(\d+)$/);
            return match ? {width:match[1], height:match[2]} : null;
        }
        function customRatioValue(){
            const w = Number(customRatioWidth);
            const h = Number(customRatioHeight);
            return w > 0 && h > 0 ? w / h : null;
        }
        function customSizeValue(){
            const w = Number(customWidth);
            const h = Number(customHeight);
            return w > 0 && h > 0 ? `${Math.round(w)}x${Math.round(h)}` : '';
        }
        function getImageDimensions(src){
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve({width:img.naturalWidth, height:img.naturalHeight});
                img.onerror = reject;
                img.src = src;
            });
        }
        function firstReferenceDimension(){
            return [1,2,3].map(id => refDims[id]).find(dim => dim?.width && dim?.height) || null;
        }

        function setRatio(next, preferredSize = ''){
            ratio = next;
            if (preferredSize) {
                const match = SIZE_OPTIONS[next]?.find(([value]) => value === preferredSize);
                if (match) resolution = match[1];
            }
            if(next !== 'custom') {
                customRatioWidth = '';
                customRatioHeight = '';
            }
            updateSizeUI();
        }

        function setCustomRatio(){
            customRatioWidth = document.getElementById('ratioCustomWidth').value;
            customRatioHeight = document.getElementById('ratioCustomHeight').value;
            ratio = 'custom';

            updateSizeUI();

        function setResolution(next){
            resolution = next;

                ratio = '';

                customHeight = '';

        function updateSizeUI(){
            const ratioSelect = document.getElementById('ratioSelect');
            const ratioField = document.getElementById('ratioField');
            const ratioCustomWidthInput = document.getElementById('ratioCustomWidth');
            const ratioCustomHeightInput = document.getElementById('ratioCustomHeight');
            const resolutionSelect = document.getElementById('resolutionSelect');
            const resolutionField = document.getElementById('resolutionField');
            const sizeCustomWidthInput = document.getElementById('sizeCustomWidth');

            const fitImageSizeBtn = document.getElementById('fitImageSizeBtn');
            ratioSelect.value = ratio;

            ratioField.classList.toggle('custom', ratio === 'custom');
            ratioCustomWidthInput.value = customRatioWidth;
            ratioCustomHeightInput.value = customRatioHeight;
            resolutionSelect.value = resolution;
            resolutionField.classList.toggle('custom', resolution === 'custom');
            sizeCustomWidthInput.value = customWidth;
            sizeCustomHeightInput.value = customHeight;

        function updateResolutionUI(){}
        function fitCustomSizeToImage(event){
            if(event) event.preventDefault();
            const dim = firstReferenceDimension();
            if(!dim) return;
            resolution = 'custom';
            ratio = '';
            customWidth = dim.width;
            customHeight = dim.height;
            updateSizeUI();
        }

        function currentSize(){
            if(resolution === 'custom') return customSizeValue();
            const options = SIZE_OPTIONS[ratio] || SIZE_OPTIONS.square;
            if(ratio === 'custom'){
                const parsed = customRatioValue();
                const longSide = RES_LONG_SIDE[resolution] || 1024;
                if(parsed){
                    const pixelLimit = RES_PIXEL_LIMIT[resolution] || (longSide * longSide);
                    const rawWidth = parsed >= 1 ? longSide : Math.min(longSide * parsed, Math.sqrt(pixelLimit * parsed));
                    const rawHeight = parsed >= 1 ? Math.min(longSide / parsed, Math.sqrt(pixelLimit / parsed)) : longSide;
                    const width = Math.floor(rawWidth / 16) * 16;
                    const height = Math.floor(rawHeight / 16) * 16;
                    return `${Math.max(64, width)}x${Math.max(64, height)}`;
                }
            }
            const match = options.find(([, label]) => label === resolution) || SIZE_OPTIONS.square.find(([, label]) => label === resolution) || SIZE_OPTIONS.square[0];
            return match[0];
        }

        [1,2,3].forEach(id => {
            const zone = document.getElementById(`drop-zone-${id}`);
            zone.ondragover = e => { e.preventDefault(); zone.classList.add('drag-over'); };
            zone.ondragleave = () => zone.classList.remove('drag-over');
            zone.ondrop = e => { e.preventDefault(); zone.classList.remove('drag-over'); handleFile(e.dataTransfer.files[0], id); };
        });
        window.addEventListener('paste', e => {
            const item = [...(e.clipboardData?.items || [])].find(x => x.kind === 'file' && x.type.startsWith('image/'));
            if (item) handleFile(item.getAsFile(), firstEmptySlot());
        });
        function firstEmptySlot(){ return [1,2,3].find(id => !refs[id]) || 1; }

        function renderReferencePreview(index, url){
            const previewUrl = String(url || '').trim();
            if(!previewUrl) return;
            const prev = document.getElementById(`prev${index}`);
            prev.src = previewUrl;
            prev.classList.remove('hidden');
            document.getElementById(`del${index}`).classList.remove('hidden');
            getImageDimensions(previewUrl).then(dim => {
                refDims[index] = dim;
                updateSizeUI();
            }).catch(() => {});
        }

        function setReferenceSlot(index, reference){
            if(!reference || typeof reference !== 'object') return false;
            const url = String(reference.url || '').trim();
            if(!url) return false;
            refs[index] = reference;
            renderReferencePreview(index, url);
            return true;
        }

        async function handleFile(file, index){
            if(!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                renderReferencePreview(index, e.target.result);
            };
            reader.readAsDataURL(file);
            try {
                const form = new FormData();
                form.append('files', file);
                const {body} = await requestJson('/api/ai/upload', {method:'POST', body:form});
                const uploaded = Array.isArray(body.files) ? body.files[0] : null;
                if(!setReferenceSlot(index, uploaded)) throw new Error('参考图片上传后不可用');
            } catch(err) {
                clearSlot(index);
                showResultError(err.message || '参考图片上传失败');
            }
        }
        function clearSlot(index, ev){
            if(ev) ev.stopPropagation();
            refs[index] = null;
            refDims[index] = null;
            document.getElementById(`prev${index}`).src = '';
            document.getElementById(`prev${index}`).classList.add('hidden');
            document.getElementById(`del${index}`).classList.add('hidden');
        }

        function onlineProductionContext(){
            const params = new URLSearchParams(location.search);
            const context = {
                project_id: String(params.get('project_id') || '').trim(),
                entity_id: String(params.get('entity_id') || '').trim(),
                canvas_id: String(params.get('canvas_id') || '').trim()
            };
            return Object.fromEntries(Object.entries(context).filter(([, value]) => value));
        }

        function episodeStageContext(){
            const params = new URLSearchParams(location.search);
            return {
                pipelineId: String(params.get('episode_pipeline_id') || '').trim(),
                stage: String(params.get('episode_stage') || '').trim(),
            };
        }

        async function completeEpisodeStage(status, result={}, message=''){
            const context = episodeStageContext();
            if(!context.pipelineId || !context.stage || activeOnlineTask.episodeCallbackDone) return;
            activeOnlineTask.episodeCallbackDone = true;
            const outputItems = Array.isArray(result.image_items) ? result.image_items : (Array.isArray(result.items) ? result.items : []);
            const assetIds = Array.isArray(result.asset_ids)
                ? result.asset_ids.map(value => String(value || '').trim()).filter(Boolean)
                : outputItems.map(item => String(item?.asset_id || '').trim()).filter(Boolean);
            const sourceJobId = String(result.job_id || activeJobId()).trim();
            try {
                await requestJson(`/api/episode-pipelines/${encodeURIComponent(context.pipelineId)}/stages/${encodeURIComponent(context.stage)}/complete`, {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({status, source_job_id:sourceJobId, output_asset_ids:[...new Set(assetIds)], message:message || (status === 'succeeded' ? '资产生成已回写' : '资产生成失败')})
                });
            } catch(err) {
                activeOnlineTask.episodeCallbackDone = false;
                showResultError(`阶段回写失败：${err.message || '请求失败'}`, {jobId:sourceJobId});
            }
        }

        async function loadSelectedAssetReference(){
            const requestedId = String(new URLSearchParams(location.search).get('asset_id') || '').trim();
            if(!requestedId) return;
            try {
                const {body} = await requestJson(`/api/asset-registry/assets/${encodeURIComponent(requestedId)}`);
                const asset = body.asset && typeof body.asset === 'object' ? body.asset : {};
                const assetId = typeof asset.id === 'string' ? asset.id.trim() : '';
                const url = String(asset.public_url || asset.url || '').trim() || (assetId ? `/api/asset-registry/assets/${encodeURIComponent(assetId)}/media` : '');
                if(!assetId || !url) throw new Error('已选资产不可作为参考图片');
                setReferenceSlot(firstEmptySlot(), {url, name:String(asset.name || ''), asset_id:assetId});
            } catch(err) {
                showResultError(err.message || '已选资产无法加载，请从资产中心重新选择。');
            }
        }

        async function submitImage(){
            const prompt = document.getElementById('promptInput').value.trim();
            if(!prompt){ showResultError(tr('online.promptRequired')); return; }
            const btn = document.getElementById('genBtn');
            clearOnlineTaskPoll();
            forgetOnlineTask();
            activeOnlineTask = onlineTaskState();
            btn.disabled = true;
            clearResultError();
            document.getElementById('placeholder').classList.add('hidden');
            document.getElementById('outputImg').classList.add('hidden');
            document.getElementById('downloadBtn').classList.add('hidden');
            setGenerationState('submitting', '正在提交生成请求。');
            try {
                const reqBody = { prompt, provider_id:provider, model:selectedModel, size:currentSize(), n:outputCount, reference_images:Object.values(refs).filter(Boolean) };
                const productionContext = onlineProductionContext();
                if(Object.keys(productionContext).length) reqBody.production_context = productionContext;
                const inputAssetIds = selectedInputAssetIds();
                if(inputAssetIds.length) reqBody.input_asset_ids = inputAssetIds;
                if(QUALITY_PROTOCOLS.has(providerProtocol(provider))) reqBody.quality = quality;
                const {body:result, status} = await requestJson('/api/online-image', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body:JSON.stringify(reqBody)
                });
                const jobId = String(result.job_id || '').trim();
                activeOnlineTask.jobId = jobId;
                rememberOnlineTask(jobId);
                if(result.jimeng_pending || status === 202){
                    activeOnlineTask.lastStatus = 'running';
                    setGenerationState('remote_pending', result.message || '上游任务仍在排队，可安全续查。');
                    scheduleOnlineTaskPoll(0);
                    return;
                }
                if(Array.isArray(result.images) && result.images.length){
                    completeOnlineTask(result);
                    return;
                }
                if(jobId){
                    setGenerationState('queued', '任务已创建，正在读取持久状态。');
                    scheduleOnlineTaskPoll(0);
                    return;
                }
                throw new Error('生成任务未返回可追踪的任务 ID。');
            } catch(err) {
                showResultError(err.message || '生成失败');
                void completeEpisodeStage('failed', {job_id:activeJobId()}, err.message || '生成失败');
            }
        }

        function historyCardId(data){
            const source = String(data.asset_id || data.history_id || data.job_id || data.timestamp || 'entry');
            return `history-${source.replace(/[^a-zA-Z0-9_-]/g, '_')}`;
        }

        function generationHistoryItems(result){
            const urls = Array.isArray(result?.images) ? result.images : (Array.isArray(result?.urls) ? result.urls : []);
            const outputItems = Array.isArray(result?.image_items) ? result.image_items : (Array.isArray(result?.items) ? result.items : []);
            const outputAssetIds = Array.isArray(result?.asset_ids) ? result.asset_ids : [];
            return urls.map((url, index) => {
                const output = outputItems[index] && typeof outputItems[index] === 'object' ? outputItems[index] : {};
                const assetId = typeof output.asset_id === 'string' ? output.asset_id.trim()
                    : (typeof outputAssetIds[index] === 'string' ? outputAssetIds[index].trim() : '');
                return {
                    history_id:`${String(result?.job_id || result?.timestamp || 'online')}:${index}`,
                    job_id:String(result?.job_id || '').trim(),
                    asset_id:assetId,
                    images:[String(url || '')],
                    prompt:String(result?.prompt || ''),
                    params:result?.params && typeof result.params === 'object' ? result.params : {},
                    timestamp:Number(result?.timestamp || Date.now()),
                    status:'succeeded'
                };
            }).filter(item => item.images[0]);
        }

        function completeOnlineTask(result){
            clearOnlineTaskPoll();
            if(result?.job_id){
                activeOnlineTask.jobId = String(result.job_id || '').trim();
                rememberOnlineTask(activeOnlineTask.jobId);
            }
            const images = Array.isArray(result?.images) ? result.images.filter(Boolean) : (Array.isArray(result?.urls) ? result.urls.filter(Boolean) : []);
            if(!images.length){
                forgetOnlineTask();
                showResultError('任务已完成，但未找到可显示的输出资产。', {jobId:activeJobId()});
                void completeEpisodeStage('failed', result, '任务完成但未返回输出资产');
                return;
            }
            currentResult = {...result, images};
            const output = document.getElementById('outputImg');
            output.src = images[0];
            output.classList.remove('hidden');
            const download = document.getElementById('downloadBtn');
            download.href = images[0];
            download.classList.remove('hidden');
            clearResultError();
            setGenerationState('succeeded');
            forgetOnlineTask();
            document.getElementById('genBtn').disabled = false;
            generationHistoryItems(currentResult).forEach(item => renderImageCard(item, true));
            loadHistory(0);
            void completeEpisodeStage('succeeded', currentResult);
        }

        function scheduleOnlineTaskPoll(delay=ONLINE_TASK_POLL_MS){
            if(!activeJobId()) return;
            if(activeOnlineTask.pollTimer) clearTimeout(activeOnlineTask.pollTimer);
            activeOnlineTask.pollTimer = setTimeout(pollOnlineTask, Math.max(0, Number(delay) || 0));
        }

        async function loadWorkspaceJob(jobId){
            const {body} = await requestJson(`/api/asset-registry/workspace-jobs/${encodeURIComponent(jobId)}`);
            return body.job && typeof body.job === 'object' ? body.job : null;
        }

        async function pollOnlineTask(){
            const jobId = activeJobId();
            if(!jobId || activeOnlineTask.pollInFlight) return;
            activeOnlineTask.pollInFlight = true;
            let remoteError = '';
            try {
                if(canResumeRemoteOnlineTask()){
                    try {
                        const {body:remote} = await requestJson('/api/jimeng/query-media', {
                            method:'POST', headers:{'Content-Type':'application/json'},
                            body:JSON.stringify(remoteResumePayload(jobId))
                        });
                        const remoteStatus = String(remote.status || '').toLowerCase();
                        if(remoteStatus === 'succeeded'){
                            completeOnlineTask({
                                job_id:String(remote.job_id || jobId),
                                images:Array.isArray(remote.urls) ? remote.urls : [],
                                image_items:Array.isArray(remote.items) ? remote.items : [],
                                asset_ids:Array.isArray(remote.asset_ids) ? remote.asset_ids : []
                            });
                            return;
                        }
                        if(remoteStatus === 'failed'){
                            forgetOnlineTask();
                            showResultError(remote.error || '远端生成失败，请在任务中心查看安全状态。', {jobId});
                            void completeEpisodeStage('failed', {job_id:jobId}, remote.error || '远端生成失败');
                            loadHistory(0);
                            return;
                        }
                        if(remoteStatus === 'pending' || remote.jimeng_pending){
                            setGenerationState('remote_pending', remote.message || '上游任务仍在排队，可安全续查。');
                            scheduleOnlineTaskPoll();
                            return;
                        }
                    } catch(err) {
                        remoteError = err.message || '';
                        if(remoteResumeUnavailable(err)) activeOnlineTask.remoteResumeAvailable = false;
                    }
                }

                const job = await loadWorkspaceJob(jobId);
                const status = String(job?.status || '').toLowerCase();
                activeOnlineTask.lastStatus = status;
                if(status === 'succeeded'){
                    const outputs = workspaceOutputItems(job);
                    completeOnlineTask({
                        job_id:jobId,
                        images:outputs.map(item => item.url),
                        image_items:outputs,
                        asset_ids:outputs.map(item => item.asset_id)
                    });
                    return;
                }
                if(['failed', 'canceled', 'interrupted'].includes(status)){
                    forgetOnlineTask();
                    showResultError('任务未成功完成，请在任务中心查看安全状态。', {jobId});
                    void completeEpisodeStage('failed', {job_id:jobId}, '持久任务未成功完成');
                    loadHistory(0);
                    return;
                }
                if(ONLINE_ACTIVE_STATUSES.has(status)){
                    setGenerationState(status === 'queued' || status === 'pending' ? 'queued' : 'running', remoteError || '任务状态已持久化，正在继续执行。');
                    scheduleOnlineTaskPoll();
                    return;
                }
                setGenerationState('running', remoteError || '正在读取任务状态。');
                scheduleOnlineTaskPoll();
            } catch(err) {
                setGenerationState('running', err.message || '任务状态暂不可读取，正在重试。');
                scheduleOnlineTaskPoll();
            } finally {
                activeOnlineTask.pollInFlight = false;
            }
        }

        function renderImageCard(data, isNew=false){
            const cardId = historyCardId(data);
            if(document.getElementById(cardId)) return;
            const card = document.createElement('div');
            card.id = cardId;
            card.className = 'masonry-item group relative cursor-zoom-in';
            const imageUrl = Array.isArray(data.images) ? String(data.images[0] || '') : '';
            if(imageUrl){
                const multi = Array.isArray(data.images) && data.images.length > 1
                    ? `<div class="absolute top-3 right-3 bg-black/60 text-white text-[10px] font-black px-2 py-0.5 rounded-full pointer-events-none">×${data.images.length}</div>` : '';
                card.innerHTML = `<img src="${escapeHtml(imageUrl)}" class="w-full h-full object-cover block group-hover:scale-105 transition-transform duration-1000" loading="lazy">${multi}
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 p-6 flex flex-col justify-end"><p class="text-white text-[10px] font-medium line-clamp-2 uppercase tracking-wider">${escapeHtml(data.prompt || tr('online.onlineImageFallback'))}</p></div>`;
                card.onclick = () => openLightbox(data);
            } else {
                card.classList.remove('cursor-zoom-in');
                const status = taskStatusText(data.status);
                card.innerHTML = `<button type="button" class="h-full w-full p-5 text-left transition-colors hover:bg-gray-50"><span class="block text-[9px] font-black uppercase tracking-[0.25em] text-gray-400">持久任务</span><strong class="mt-3 block text-sm text-gray-800">${escapeHtml(status)}</strong><span class="mt-2 block text-xs leading-5 text-gray-400">${escapeHtml(data.job_id || '任务详情可在任务中心查看')}</span></button>`;
                card.querySelector('button').addEventListener('click', () => openTask(data.job_id));
            }
            isNew ? document.getElementById('masonry').prepend(card) : document.getElementById('masonry').appendChild(card);
            lucide.createIcons();
        }

        function setHistoryState(state, message=''){
            const node = document.getElementById('historyState');
            const loadMore = document.getElementById('loadMoreTrigger');
            if(!state){
                node.classList.add('hidden');
                node.textContent = '';
                return;
            }
            node.textContent = message;
            node.classList.remove('hidden');
            if(state !== 'loading') loadMore.classList.add('hidden');
        }

        async function historyRecordsForJob(summary){
            let job = summary;
            try { job = await loadWorkspaceJob(String(summary.id || '')) || summary; } catch(_) {}
            const outputs = workspaceOutputItems(job);
            if(outputs.length){
                return outputs.map((output, index) => ({
                    history_id:`${String(job.id || summary.id || '')}:${index}`,
                    job_id:String(job.id || summary.id || ''),
                    asset_id:output.asset_id,
                    images:[output.url],
                    status:String(job.status || summary.status || 'succeeded'),
                    timestamp:Number(job.finished_at || job.updated_at || job.created_at || summary.updated_at || summary.created_at || 0)
                }));
            }
            return [{
                history_id:String(summary.id || ''),
                job_id:String(summary.id || ''),
                status:String(summary.status || 'queued'),
                timestamp:Number(summary.updated_at || summary.created_at || 0)
            }];
        }

        async function loadPersistentHistory(){
            const query = new URLSearchParams({job_type:'generation.online_image', limit:String(ONLINE_HISTORY_LIMIT)});
            Object.entries(onlineProductionContext()).forEach(([key, value]) => query.set(key, value));
            const {body} = await requestJson(`/api/asset-registry/workspace-jobs?${query}`);
            const jobs = Array.isArray(body.jobs) ? body.jobs : [];
            restorePersistentOnlineTask(jobs);
            const records = [];
            for(let index = 0; index < jobs.length; index += 8){
                const batch = await Promise.all(jobs.slice(index, index + 8).map(historyRecordsForJob));
                batch.forEach(items => records.push(...items));
            }
            return records;
        }

        async function loadHistory(page=0){
            if(isLoading) return;
            isLoading = true;
            const loader = document.getElementById('loadMoreTrigger');
            try {
                if(page === 0){
                    loader.innerText = tr('online.loadingArchives');
                    setHistoryState('loading', '正在载入持久生成任务…');
                    allHistory = await loadPersistentHistory();
                    document.getElementById('masonry').innerHTML = '';
                    currentIndex = 0;
                }
                const next = allHistory.slice(currentIndex, currentIndex + PAGE_SIZE);
                next.forEach(item => renderImageCard(item));
                currentIndex += next.length;
                if(!allHistory.length){
                    setHistoryState('empty', '暂无持久生成任务。');
                } else {
                    setHistoryState('', '');
                }
                loader.classList.toggle('hidden', currentIndex >= allHistory.length);
                loader.innerText = tr('online.loadMore');
            } catch(err) {
                allHistory = [];
                currentIndex = 0;
                document.getElementById('masonry').innerHTML = '';
                setHistoryState('error', err.message || '持久任务历史暂不可读取。');
            } finally {
                isLoading = false;
            }
        }
        let lightboxPreview = null;
        function ensureLightboxPreview(){
            if(!lightboxPreview && window.StudioImagePreview){
                lightboxPreview = StudioImagePreview.attach(document.getElementById('lightboxFrame'));
            }
            return lightboxPreview;
        }
        function openLightbox(data){
            currentLightboxData = data;
            const img = document.getElementById('lightboxImg');
            const res = document.getElementById('lightboxRes');
            res.textContent = '...';
            ensureLightboxPreview();
            if(lightboxPreview) lightboxPreview.reset();
            img.onload = () => { res.textContent = img.naturalWidth && img.naturalHeight ? `${img.naturalWidth} x ${img.naturalHeight}` : (data.params?.size || '--'); };
            img.src = data.images[0];
            document.getElementById('lightboxPrompt').textContent = data.prompt || '';
            document.getElementById('useAsReferenceBtn').classList.toggle('hidden', !String(data.asset_id || '').trim());
            document.getElementById('lightbox').classList.replace('hidden','flex');
            document.body.style.overflow='hidden';
            lucide.createIcons();
        }
        function closeLightbox(){
            if(lightboxPreview) lightboxPreview.reset();
            document.getElementById('lightbox').classList.replace('flex','hidden');
            document.body.style.overflow='auto';
        }
        function handleOutsideClick(e){ if(e.target.id === 'lightbox') closeLightbox(); }
        async function downloadLightboxImage(e){
            e.stopPropagation();
            const url = currentLightboxData?.images?.[0];
            if(!url) return;
            try {
                const res = await fetch(url);
                if(!res.ok) throw new Error('下载失败');
                const blob = await res.blob();
                const clean = url.split('?')[0];
                const ext = clean.includes('.') ? clean.split('.').pop() : 'png';
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `online-image-${Date.now()}.${ext || 'png'}`;
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(link.href), 1000);
            } catch(err) {
                closeLightbox();
                showResultError(err.message || '下载失败');
            }
        }
        function zoomImage(){
            const item = generationHistoryItems(currentResult)[0] || currentResult;
            if(item?.images?.[0]) openLightbox(item);
        }
        function useLightboxAssetAsReference(){
            const assetId = String(currentLightboxData?.asset_id || '').trim();
            const url = String(currentLightboxData?.images?.[0] || '').trim();
            if(!assetId || !url){
                showResultError('当前输出没有可用的稳定资产 ID。');
                return;
            }
            setReferenceSlot(firstEmptySlot(), {url, asset_id:assetId});
            closeLightbox();
            clearResultError();
            window.scrollTo({top:0, behavior:'smooth'});
        }
        function applySameStyle(){
            if(!currentLightboxData) return;
            document.getElementById('promptInput').value = currentLightboxData.prompt || '';
            [1,2,3].forEach(id => clearSlot(id));
            (currentLightboxData.params?.reference_images || []).slice(0,3).forEach((ref,i) => {
                refs[i+1] = ref; const prev = document.getElementById(`prev${i+1}`);
                prev.src = ref.url; prev.classList.remove('hidden'); document.getElementById(`del${i+1}`).classList.remove('hidden');
                getImageDimensions(ref.url).then(dim => {
                    refDims[i+1] = dim;
                    updateSizeUI();
                }).catch(() => {});
            });
            const size = currentLightboxData.params?.size || '1024x1024';
            const matchedRatio = Object.keys(SIZE_OPTIONS).find(key => SIZE_OPTIONS[key].some(([value]) => value === size)) || 'square';
            const matchedRes = SIZE_OPTIONS[matchedRatio]?.find(([value]) => value === size)?.[1];
            if(matchedRes) {
                setRatio(matchedRatio, size);
                setResolution(matchedRes);
            } else {
                setResolution('custom');
                const parsed = parseSizeValue(size);
                customWidth = parsed?.width || '';
                customHeight = parsed?.height || '';
                updateSizeUI();
            }
            closeLightbox(); window.scrollTo({top:0, behavior:'smooth'});
        }
        const observer = new IntersectionObserver(entries => { if(entries[0].isIntersecting && currentIndex < allHistory.length) loadHistory(1); }, {threshold:.1});
        window.onload = async () => { applyLanguage(); setRatio('square'); setResolution('1k'); await initModels(); await loadSelectedAssetReference(); await loadHistory(0); observer.observe(document.getElementById('loadMoreTrigger')); document.getElementById('loadMoreTrigger').onclick = () => loadHistory(1); };
    </script>
