name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 tests and hygiene
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装运行期与测试依赖
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: 验证关键依赖可导入
        run: python -c "import fastapi, httpx, pydantic, pytest, uvicorn; print('依赖导入通过:', fastapi.__version__, pydantic.__version__, uvicorn.__version__)"

      - name: 运行全量测试
        run: python -m pytest -q --no-header -p no:cacheprovider

      - name: 扫描二进制白名单
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          banned_extensions = {
              # 图片 / 截图
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".bmp", ".ico", ".svg",
              # 字体（仅 3 条思源黑体白名单例外）
              ".ttf", ".otf", ".woff", ".woff2", ".eot",
              # 音频 / 视频
              ".mp3", ".wav", ".ogg", ".mp4", ".mov", ".avi", ".mkv",
              # 压缩包
              ".zip", ".gz", ".7z", ".rar", ".tar", ".tgz", ".bz2", ".xz",
              # 可执行文件 / 动态库 / 安装包 / 脚本二进制
              ".exe", ".dll", ".so", ".dylib", ".bin", ".msi", ".app",
              ".bat", ".cmd", ".com", ".scr",
              # 文档类二进制（本地策略超集；与 tests/hygiene/cleanroom_extensions.py 逐项一致）
              ".pdf",
          }
          allowlist = {
              "src/gods_workbench/static/vendor/fonts/SourceHanSansCN-Bold.otf",
              "src/gods_workbench/static/vendor/fonts/SourceHanSansCN-Medium.otf",
              "src/gods_workbench/static/vendor/fonts/SourceHanSansCN-Normal.otf",
          }
          violations = []
          for path in Path(".").rglob("*"):
              if ".git" in path.parts or not path.is_file():
                  continue
              relative = path.as_posix().lstrip("./")
              if path.suffix.lower() in banned_extensions and relative not in allowlist:
                  violations.append(relative)
          if violations:
              print("发现不在白名单内的二进制资源:")
              print("\n".join(sorted(violations)))
              sys.exit(1)
          print("二进制白名单扫描通过；允许项仅为 3 个 Source Han Sans CN 字体路径。")
          PY
