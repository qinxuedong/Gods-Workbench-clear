  auth: "读取端点要求认证；写入/治理端点先做角色检查，再执行失败关闭；OIDC 角色不信任请求头。"
  cas: "本最小闭环不执行资源写入，因此不伪造版本推进；后续真实写服务必须带 expected_version 并返回 409。"
